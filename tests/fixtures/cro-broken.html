<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversion problems</title>
<meta name="description" content="Planted conversion problems for cro-check.mjs.">
<!-- Planted (each one cro-check must find):
  1. three equally styled primary buttons in the first screen          cro-competing-cta
  2. a "Learn more" CTA and a lead form whose submit says "Submit"       cro-generic-cta
  3. "Learn more" links to a page that doesn't exist; "Book a demo" is #  cro-dead-cta (fail / warn)
  4. a 9-field lead form, 7 required                                    cro-form-fields
  5. email input type=text with no autocomplete                         cro-autocomplete, cro-input-type
  6. phone input type=text with no inputmode or autocomplete            cro-autocomplete, cro-input-type
  7. a password field with no show toggle                               cro-password-toggle (info)
  8. a full-screen offer popup 0.6 s after load, no Esc, no memory      cro-popup-intrusive, cro-popup-no-memory
  9. which covers the hero CTA on arrival                               cro-cta-covered
 10. gtag present; the CTA click sends cta_click twice                  cro-analytics-duplicate
-->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date()); gtag("config", "G-TEST000");
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  header { height: 64px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #ddd; }
  .hero { padding: 48px 16px; background: #f5f7ff; }
  .hero h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; margin: 0 0 16px; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font: 600 16px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  form { display: grid; gap: 12px; margin: 24px 0 48px; }
  label { display: grid; gap: 4px; }
  input, select, textarea { font: 16px system-ui, sans-serif; padding: 10px 12px; border: 1px solid #999; border-radius: 6px; }
  .promo { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; z-index: 100; }
  .promo.open { display: flex; }
  .promo .card { position: relative; background: #fff; padding: 32px; border-radius: 12px; width: min(92vw, 440px); }
  .promo .x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; background: none; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>
<header><strong>Acme</strong></header>
<section class="hero">
  <h1>Everything your team needs</h1>
  <p>Plans, docs and chat in one place.</p>
  <div class="ctas">
    <a class="btn" id="start" href="#signup">Start free trial</a>
    <a class="btn" href="#">Book a demo</a>
    <a class="btn" href="pricing-missing.html">Learn more</a>
  </div>
</section>
<main>
  <h2>Talk to sales</h2>
  <form id="lead" action="/lead" method="post">
    <label>First name <input name="first_name" autocomplete="given-name" required></label>
    <label>Last name <input name="last_name" autocomplete="family-name" required></label>
    <label>Work email <input type="text" name="email" required></label>
    <label>Phone <input type="text" name="phone" required></label>
    <label>Company <input name="company" autocomplete="organization" required></label>
    <label>Job title <input name="job_title" required></label>
    <label>Company size <select name="size" required><option>1-10</option><option>11-50</option><option>51+</option></select></label>
    <label>Country <select name="country" autocomplete="country"><option>United States</option><option>India</option></select></label>
    <label>Message <textarea name="message" rows="3"></textarea></label>
    <button class="btn" type="submit">Submit</button>
  </form>
  <h2 id="signup">Create your account</h2>
  <form id="signup-form" action="/signup" method="post">
    <label>Email <input type="email" name="email" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <button class="btn" type="submit">Create account</button>
  </form>
</main>
<div class="promo" id="promo" role="dialog" aria-modal="true" aria-labelledby="promo-title">
  <div class="card">
    <button class="x" aria-label="Close" onclick="document.getElementById('promo').classList.remove('open')">×</button>
    <h2 id="promo-title">Get 10% off your first month</h2>
    <p>Join the list for the discount code.</p>
    <form onsubmit="return false"><label>Email <input type="email" autocomplete="email"></label> <button class="btn" type="submit">Claim my discount</button></form>
  </div>
</div>
<script>
  // The offer opens on every load (no dismissal memory) and ignores Esc.
  setTimeout(() => document.getElementById("promo").classList.add("open"), 600);
  // Two listeners on the main CTA, both sending the same event.
  const start = document.getElementById("start");
  start.addEventListener("click", () => gtag("event", "cta_click", { location: "hero" }));
  start.onclick = () => gtag("event", "cta_click", { location: "hero" });
</script>
</body>
</html>
