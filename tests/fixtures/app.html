<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<!-- An app screen: no description, no share image, no footer. The review should judge it as an app and skip
     the marketing checks. Contrast: the selected tab's dark text sits on a white pill that is a positioned
     sibling behind it (must not be flagged); the faint hint is #9a9a9a on white, 2.8:1 (must be flagged). -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #eee; background: #111; }
  nav { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
  .seg { position: relative; display: inline-grid; grid-template-columns: repeat(3, 96px); background: #222; border-radius: 999px; padding: 2px; }
  .seg .pill { position: absolute; top: 2px; bottom: 2px; left: 2px; width: 96px; background: #fcfcfc; border-radius: 999px; }
  .seg a { position: relative; z-index: 1; color: #ddd; text-decoration: none; text-align: center; line-height: 40px; border-radius: 999px; }
  .seg a[aria-current="page"] { color: #111; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .panel { background: #fff; color: #111; border-radius: 16px; padding: 20px; }
  .faint { color: #9a9a9a; font-size: 14px; }
  textarea, select { font: 16px system-ui, sans-serif; width: 100%; }
  @media (prefers-color-scheme: dark) { .panel { background: #1c1c1c; } }   /* the text stays #111: unreadable in dark */
</style>
</head>
<body>
<nav><strong>Studio</strong><div class="seg"><span class="pill"></span><a href="#" aria-current="page">Maker</a><a href="#">Review</a><a href="#">Publish</a></div></nav>
<main>
  <h1>What are we building?</h1>
  <div class="panel">
    <textarea rows="3" aria-label="Describe it"></textarea>
    <p class="faint">Drop a video, GIF or image</p>
    <p>Builds take about five minutes.</p>
    <select aria-label="Kind"><option>Creative</option><option>Functional</option></select>
  </div>
</main>
</body>
</html>
